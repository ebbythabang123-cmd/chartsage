version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: chartsage-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: chartsage
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/chartsage
      interval: 10s
      timeout: 5s
      retries: 5

  chartsage:
    build: .
    container_name: chartsage-app
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/chartsage
      PORT: 5000
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

volumes:
  mongodb_data:
